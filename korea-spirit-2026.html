<script>
(function(){

  var b = document.getElementById('playBtn');
  if(!v || !b) return;
  b.addEventListener('click', function(){
    if(v.paused){ var p = v.play(); if(p && p.catch) p.catch(function(){}); b.textContent = '❚❚ 일시정지'; }

  });
  v.addEventListener('play', function(){ b.textContent = '❚❚ 일시정지'; });

})();
